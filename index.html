 $('issueCount').textContent=issue.papers.length;
 $('overviewTeaser').textContent=issue.teaser;
 $('overviewBody').innerHTML=issue.overview.map(x=>`<p>${escapeHTML(x)}</p>`).join('');
 $('coverageBody').innerHTML=`<p>${escapeHTML(issue.coverage)}</p><p>${issue.sources.map(x=>`<a href="${safeURL(x.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(x.label)} ↗</a>`).join('　')}</p>`;
 $('countAll').textContent=issue.papers.length;$('countInternational').textContent=issue.papers.filter(p=>p.scope==='international').length;$('countChinese').textContent=issue.papers.filter(p=>p.scope==='chinese').length;
 $('subjectSelect').innerHTML='<option value="all">全部方向</option>'+[...new Set(issue.papers.map(p=>p.subject))].map(x=>`<option value="${escapeHTML(x)}">${escapeHTML(x)}</option>`).join('');
 renderExtras();
 resetFilters();
}
function renderExtras(){
 const el=$('issueExtras');
 el.hidden=!issue.directory&&!issue.journalChecks;
 const link=x=>`<a href="${safeURL(x.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(x.title||x.journal)} ↗</a>`;
 const directory=(issue.directory||[]);
 const groups=[['近期在线优先与首次在线基线',x=>x.status.startsWith('在线')],['国内中文 A 刊目录',x=>x.status.startsWith('国内')],['国际正式刊期目录',x=>!x.status.startsWith('在线')&&!x.status.startsWith('国内')]];
 el.innerHTML=`<details open><summary>最值得精读的 3 篇</summary><ol>${(issue.recommendations||[]).map(x=>{const p=issue.papers.find(p=>p.id===x.id);return p?`<li><button class="recommendation" data-paper-id="${escapeHTML(p.id)}">${escapeHTML(p.title)} →</button><p>${escapeHTML(x.reason)}</p></li>`:'';}).join('')}</ol></details><details><summary>更多文章目录 · ${directory.length} 篇</summary><p>${escapeHTML(issue.directoryNote||'')}</p>${groups.map(([title,filter])=>{const entries=directory.filter(filter);return entries.length?`<h3>${title}</h3>${['经济','金融','管理'].map(group=>{const rows=entries.filter(x=>x.group===group);return rows.length?`<h4>${group}</h4><ul>${rows.map(x=>`<li>${link(x)}<p>${escapeHTML(x.journal)} · ${escapeHTML(x.status)} · ${escapeHTML(x.date)}</p></li>`).join('')}</ul>`:'';}).join('')}`:'';}).join('')}</details><details><summary>逐刊核查与覆盖缺口 · ${(issue.journalChecks||[]).length} 刊</summary><p>访问失败或尚未完成核验，不代表该刊没有新增文章。</p><ul>${(issue.journalChecks||[]).map(x=>`<li>${link(x)} · ${escapeHTML(x.group)}<p>${escapeHTML(x.issue)} · ${escapeHTML(x.status)}</p>${x.online?`<p>在线优先：${escapeHTML(x.online)}</p>`:''}</li>`).join('')}</ul></details><details><summary>从本期延伸的研究问题</summary><p>以下为简报的阅读延伸，不是作者已验证的结论。</p><ol>${(issue.inspirations||[]).map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ol></details>`;
 el.onclick=e=>{const b=e.target.closest('button[data-paper-id]');if(b){resetFilters();selectPaper(b.dataset.paperId,true);}};
}
function renderList(){
 visible=issue.papers.filter(p=>(scope==='all'||p.scope===scope)&&(subject==='all'||p.subject===subject)&&[p.title,p.english,p.authors,p.keywords,p.subject,p.journal].join(' ').toLocaleLowerCase().includes(query.toLocaleLowerCase()));
 if(!visible.some(p=>p.id===selected))selected=null;
 $('main').classList.toggle('reading',!!selected);
 $('resultCount').textContent=`${visible.length} 篇论文`;$('reset').hidden=scope==='all'&&subject==='all'&&!query;$('empty').hidden=!!visible.length;
 $('paperList').innerHTML=visible.map(p=>`<button class="paper-card" data-id="${escapeHTML(p.id)}" aria-current="${p.id===selected}"><span class="card-top"><span>${escapeHTML(p.journal)} · ${p.scope==='chinese'?'中文 A 刊':'国际期刊'}</span><span class="card-number">${String(issue.papers.indexOf(p)+1).padStart(2,'0')}</span></span>${p.publicationType?`<span class="card-reason">${p.publicationType==='online'?'在线优先':'正式刊期'} · ${escapeHTML(p.onlineDate||p.issueDate||'日期见原文')}</span>`:''}<span class="card-title">${escapeHTML(p.title)}</span><span class="card-finding"><span class="card-label">核心发现</span>${escapeHTML(p.finding)}</span><span class="card-question"><span class="card-label">值得追问</span>${escapeHTML(p.question)}</span><span class="card-reason"><span class="card-label">为什么读</span>${escapeHTML(p.reason)}</span><span class="card-bottom"><span class="card-tag">${escapeHTML(p.subject)}</span><span>打开六问 →</span></span></button>`).join('');
 renderReader();
}
function renderReader(){
 const p=visible.find(p=>p.id===selected);
 if(!p){$('reader').innerHTML=visible.length?'<div class="reader-placeholder"><span class="eyebrow">从一个好问题开始</span><h2>哪一个发现让你想追问？</h2><p>选择一篇论文，继续看它的争论、证据、疑点和研究启发。</p></div>':'<div class="reader-placeholder"><p>筛选结果为空</p><p>清除筛选后继续阅读。</p></div>';return;}
 const index=visible.indexOf(p);
 $('reader').innerHTML=`<button class="back-button" id="back">← 返回论文目录</button><div class="reader-top"><span>${escapeHTML(p.subject)} / ${escapeHTML(p.journal)}</span>${paperLink(p)}</div><h2 id="paperTitle">${escapeHTML(p.title)}</h2><p class="english-title">${escapeHTML(p.english)}</p><p class="authors">${escapeHTML(p.authors)}</p><p class="publication">${escapeHTML(p.publication)}</p><div class="evidence">阅读依据：${escapeHTML(p.evidence)}${p.abstractUrl?` · <a href="${safeURL(p.abstractUrl)}" target="_blank" rel="noopener noreferrer">摘要来源 ↗</a>`:''}</div>${p.pdfStatus?`<p class="evidence">PDF 获取状态：${escapeHTML(p.pdfStatus)}</p>`:''}${(p.readingSources||[]).map(x=>`<p class="evidence"><a href="${safeURL(x.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(x.label)} ↗</a></p>`).join('')}<nav class="question-nav" aria-label="跳转到解读问题">${shortQuestions.map((q,i)=>`<a href="#question-${i+1}">${i+1}. ${q}</a>`).join('')}</nav>${p.sections.map((s,i)=>`<section class="question-section" id="question-${i+1}"><div class="question-heading"><span class="question-number" aria-hidden="true">0${i+1}</span><h3>${questions[i]}</h3></div>${s.assessment?'<span class="research-note">我的判断 · 非编辑或审稿意见</span>':''}${s.critique?'<span class="research-note">阅读质疑 · 待核查</span>':''}${s.suggestion?'<span class="research-note">阅读延伸 · 待验证</span>':''}<p>${escapeHTML(s.text)}</p>${s.note?`<p class="aside-note">${escapeHTML(s.note)}</p>`:''}</section>`).join('')}<aside class="publication-assessment"><h3>我怎么看它的发表价值</h3><p>${escapeHTML(p.assessment.text)}</p><p class="aside-note">${escapeHTML(p.assessment.note)}</p></aside><div class="reader-bottom"><button id="previous" ${index===0?'disabled':''}>← 上一篇</button><span>${index+1} / ${visible.length}</span><button id="next" ${index===visible.length-1?'disabled':''}>下一篇 →</button></div>`;
 $('back').onclick=()=>{const previousId=selected;selected=null;renderList();$('paperList').querySelector(`[data-id="${previousId}"]`)?.focus();};
 $('previous').onclick=()=>selectPaper(visible[index-1].id,true);$('next').onclick=()=>selectPaper(visible[index+1].id,true);
}
function selectPaper(id,focus){selected=id;renderList();$('main').classList.add('reading');if(focus){$('reader').focus({preventScroll:true});$('reader').scrollIntoView({behavior:'auto',block:'start'});}}
function resetFilters(){selected=null;scope='all';subject='all';query='';$('search').value='';$('subjectSelect').value='all';document.querySelectorAll('[data-scope]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scope===scope)));$('main').classList.remove('reading');renderList();}
$('issueSelect').innerHTML=issues.map(i=>`<option value="${escapeHTML(i.id)}">${escapeHTML(i.label)}</option>`).join('');
$('issueSelect').onchange=e=>{issue=issues.find(i=>i.id===e.target.value);initIssue();};
$('search').oninput=e=>{query=e.target.value.trim();$('main').classList.remove('reading');renderList();};
$('subjectSelect').onchange=e=>{subject=e.target.value;$('main').classList.remove('reading');renderList();};
$('scopes').onclick=e=>{const b=e.target.closest('button[data-scope]');if(!b)return;scope=b.dataset.scope;document.querySelectorAll('[data-scope]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('main').classList.remove('reading');renderList();};
$('paperList').onclick=e=>{const b=e.target.closest('button[data-id]');if(b)selectPaper(b.dataset.id,true);};
$('reset').onclick=resetFilters;$('emptyReset').onclick=resetFilters;
initIssue();
</script></body>
</html>
